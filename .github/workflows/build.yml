name: Build PocketLife ROM

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pil curl unzip ca-certificates git

      - name: Download Kenney Furniture Kit (CC0)
        run: bash tools/fetch_assets.sh

      - name: Convert models + icons for the DS
        run: python3 tools/convert.py assets/kit .

      - name: Build ROM
        run: bash tools/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketlife-nds
          path: pocketlife.nds

      - name: Upload model preview
        uses: actions/upload-artifact@v4
        with:
          name: model-preview
          path: model_preview.png

      - name: Push model preview to the ci-preview branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/pv && cp model_preview.png /tmp/pv/
          cd /tmp/pv && git init -q && git checkout -q -b ci-preview
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "model preview for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-preview

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PocketLife build ${{ github.run_number }}
          body: "Download **pocketlife.nds** below and put it on your flashcart / SD card (or open it in melonDS)."
          files: pocketlife.nds
          make_latest: true
